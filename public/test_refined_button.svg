<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Orange Circle -->
  <circle cx="32" cy="32" r="28" fill="#ea7700" />

  <!-- Accent Square at Top-Right matching reference image -->
  <rect x="51.5" y="6.5" width="4.5" height="4.5" fill="#ea7700" rx="0.6" />

  <!-- Hand & Microphone Line Art -->
  <g stroke="#ffffff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none">
    <!-- Microphone Head -->
    <path d="M 37.8 24.8 C 38.8 21.2 41.5 19.5 44.5 20 C 47.5 20.8 49.5 23 49.8 26.5" />
    <path d="M 38 25 C 41.5 26.2 45.5 27.2 49.8 26.5" />
    <path d="M 36.8 28.5 C 40.5 29.8 44.5 30.5 48.5 29.5" />
    <path d="M 38 25 L 36.8 28.5" />
    <path d="M 49.8 26.5 L 48.5 29.5" />
    
    <!-- Microphone Handle Taper -->
    <path d="M 36.8 28.5 L 35 32" />
    <path d="M 48.5 29.5 L 45.5 33" />
    
    <!-- Thumb wrapping over handle -->
    <path d="M 28.5 33.5 C 28.5 31 31.2 30 34 30.2 C 36.8 30.5 38 32 38 34 C 38 35.8 35 36.5 32 36.2" />
    
    <!-- 4 Fingers Wrapped Around Handle -->
    <path d="M 37 32.5 C 39.5 31.8 42.5 32.5 42.5 34.5 C 42.5 36 39.8 36.5 35 36.5" />
    <path d="M 35 36.5 C 38 35.8 41.5 36.2 41.5 38.2 C 41.5 39.8 38.8 40 33.5 39.8" />
    <path d="M 33.5 39.8 C 36.5 39.2 40 39.5 40 41.5 C 40 43 37.2 43 32 42.8" />
    <path d="M 32 42.8 C 34.5 42.4 38 42.6 38 44.5 C 38 46.2 35 46.2 30.5 45.8" />
    
    <!-- Handle Bottom extending below hand -->
    <path d="M 25 45.5 L 25 49.5 C 25 50.8 28 50.8 28 49.5 L 28 45.5" />
    
    <!-- Palm edge down to cuff -->
    <path d="M 28.5 33.5 C 25.5 36.2 23 39.5 21 42.5" />
    
    <!-- Sleeve Cuff (Angled Band) -->
    <path d="M 21 42.5 L 25 44" />
    <path d="M 17.5 45.5 L 21.5 47" />
    <path d="M 21 42.5 L 17.5 45.5" />
    <path d="M 25 44 L 21.5 47" />
    
    <!-- Forearm lines extending towards bottom-left circle edge -->
    <path d="M 17.5 45.5 C 14.5 47.8 11.8 50.2 8.5 51.5" />
    <path d="M 21.5 47 C 19 49.5 16.5 52 13 54" />
    
    <!-- Audio Cable Loop coming from handle/cuff curving gracefully inside -->
    <path d="M 26 50.2 C 27 52.8 25.5 55.5 22.5 55.8 C 19.5 56 16.5 54.5 13 54" />
  </g>
</svg>